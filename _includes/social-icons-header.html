{% for item in site.data.settings.social %} {% assign first_char = item.academic
| slice: 0 %} {% if first_char == 't' %}
<span class="social-span">
  <a href="{{ item.link }}" target="_blank" class="social-icons-header"
    >{{ item.name}}<i
      class="ai ai-{{ item.icon }}-square"
      aria-hidden="true"
    ></i></a
></span>
{% else %} {% assign icon_prefix = item.prefix | default: "fab" %}
<span class="social-span">
  <a href="{{ item.link }}" target="_blank" class="social-icons-header"
    >{{ item.name}}<i
      class="{{ icon_prefix }} fa-{{ item.icon }}"
      aria-hidden="true"
    ></i></a
></span>
{% endif %} {% endfor %}
