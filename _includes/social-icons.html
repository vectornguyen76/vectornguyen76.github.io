{% for item in site.data.settings.social %} {% assign first_char = item.academic
| slice: 0 %} {% if first_char == 't' %}
<a href="{{ item.link }}" target="_blank" class="social-icons"
  ><i class="ai ai-{{ item.icon }}-square" aria-hidden="true"></i
></a>
{% else %} {% assign icon_prefix = item.prefix | default: "fab" %}
<a href="{{ item.link }}" target="_blank" class="social-icons"
  ><i class="{{ icon_prefix }} fa-{{ item.icon }}" aria-hidden="true"></i
></a>
{% endif %} {% endfor %}
