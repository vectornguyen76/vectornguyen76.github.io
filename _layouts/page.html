---
layout: default
---
<article class="page">
  <header class="page__header">
    <h1 class="page__title">{{ page.title }}</h1>
    {%- if page.description %}
    <p class="page__lead">{{ page.description }}</p>
    {%- endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
