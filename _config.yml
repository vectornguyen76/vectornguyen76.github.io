# Site identity — also feeds <title>, Open Graph and JSON-LD via jekyll-seo-tag.
title: Vector Nguyen
description: AI Engineer · Multi-Agent Systems · LLMs · Voice Agents
url: https://vectornguyen.com
baseurl: ""
lang: en_US

author:
  name: Vector Nguyen
  role: AI Engineer
  company: MoMo
  company_url: https://momo.vn
  location: Ho Chi Minh City
  email: vectornguyen76@gmail.com

# Profile links. Rendered in the sidebar and footer, and emitted as JSON-LD
# `sameAs`, so this list is the single source of truth.
social:
  name: Vector Nguyen
  links:
    - https://github.com/vectornguyen76
    - https://www.linkedin.com/in/vectornguyen76
    - https://www.facebook.com/vectornguyen76

# Build — the classic GitHub Pages builder runs Jekyll 3.10 and only
# whitelisted plugins; keep the Gemfile on `github-pages` to match it locally.
theme: null
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

# jekyll-seo-tag reads the share image per page, so set it for every page.
defaults:
  - scope: { path: "" }
    values:
      image: /assets/img/avatar-480.jpg

exclude:
  - .bundle/
  - .claude/
  - .pre-commit-config.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor/
