building:
  - title: Assistant Core
    url: https://assistantcore.com
    period: Jan 2024 – present
    summary: >-
      A multi-tenant agent and voice platform powering 50+ assistants across web
      apps, an embeddable widget, 6 messaging channels, and ESP32 and smartwatch
      devices — from a single configuration, offered as white-label SaaS.
    highlights:
      - >-
        **Agent harness:** streaming over 6 LLM providers and 13 models with
        provider-neutral messages, bounded tool loops and automatic context
        compaction; prompt caching cuts input-token cost by up to **90%**.
      - >-
        **Tools:** 6 tool paths (built-in, custom HTTP, remote MCP, local connectors,
        device MCP and IoT) behind one contract, with per-call allow/ask/deny approval
        and execution tracing.
      - >-
        **Voice runtime:** staged VAD → ASR → LLM → TTS and real-time speech-to-speech
        with Opus streaming and barge-in; first audio in **~1.2 s** (real-time) and
        ~1.5 s (staged) after the user stops talking.
      - >-
        **Knowledge & memory:** hybrid RAG fusing pgvector and full-text search with
        RRF over 13+ document formats with OCR, plus long-term memory with background
        fact extraction and nightly consolidation.
      - >-
        **Channels & devices:** Zalo OA, Messenger, Instagram, WhatsApp, Telegram and
        TikTok Shop; ESP32 devices over WebSocket and MQTT+UDP with encrypted audio
        and OTA updates.
      - >-
        **White-label multi-tenant:** custom domains, RBAC and credit-based billing.
    tags:
      - PostgreSQL/pgvector
      - Redis
      - MCP
      - MQTT+UDP
      - Langfuse
      - Grafana

side:
  - title: Search Engine System
    repo: https://github.com/vectornguyen76/search-engine-system
    period: Dec 2023
    summary: Scalable image and full-text search over 100,000 Shopee products, built as microservices.
    highlights:
      - >-
        Image search with async programming, gRPC, a vector database, TensorRT
        and dynamic batching — **200 RPS at 100 ms p95 latency**.
      - >-
        Full-text search and autocomplete on Elasticsearch with custom scoring
        scripts, improving relevancy by **35%**.
      - >-
        CI/CD with Docker, GitHub Actions, Ansible and CloudFormation; deployed
        to AWS EKS with Helm charts.
    tags: [gRPC, TensorRT, Elasticsearch, Vector DB, AWS EKS]
    media:
      src: /assets/img/projects/search-engine.mp4
      poster: /assets/img/projects/search-engine.webp
      width: 600
      height: 338
